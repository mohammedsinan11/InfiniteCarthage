    <!--
      Silkscreen fuer Ueberschriften, Knoepfe und Zahlen - eine Pixelschrift,
      die zur Kachelgrafik passt. Fliesstext bleibt bei der Systemschrift:
      ganze deutsche Saetze in Pixelschrift liest niemand gern.
      preconnect, damit die Schrift den ersten Aufbau nicht ausbremst.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />

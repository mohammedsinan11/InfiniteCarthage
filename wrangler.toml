name = "infinite-carthage"
main = "src/worker/index.ts"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# Die oeffentliche Raumliste - ein einziges Objekt (src/worker/directory.ts).
[[durable_objects.bindings]]
name = "VERZEICHNIS"
class_name = "Verzeichnis"

# Bestenliste der Tagesexpedition - ein Objekt je Tag (src/worker/bestenliste.ts).
[[durable_objects.bindings]]
name = "BESTENLISTE"
class_name = "Bestenliste"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Verzeichnis"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Bestenliste"]

[vars]
# Kommagetrennt. Leer bedeutet: keine Einschraenkung. localhost ist immer erlaubt.
ALLOWED_ORIGINS = "https://mohammedsinan11.github.io"

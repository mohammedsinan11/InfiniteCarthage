<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<title>Probe: vier offene Optikfragen</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 22px 26px; background: #16110b; color: #f2e7d0;
         font: 13px/1.45 -apple-system, system-ui, sans-serif; width: 1180px; }
  h1 { font-family: 'Silkscreen', monospace; font-size: 20px; color: #ffd76a; margin: 0 0 4px; }
  h2 { font-family: 'Silkscreen', monospace; font-size: 14px; color: #d9a441; margin: 26px 0 6px; }
  p.lead { margin: 0 0 12px; color: #a8987c; max-width: 1120px; }
  .reihe { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
  figure { margin: 0; width: 276px; }
  figcaption { font-size: 12px; color: #cdbd9c; margin-bottom: 5px; min-height: 58px; }
  figcaption b { color: #f2e7d0; font-family: 'Silkscreen', monospace; font-size: 11px; }
  canvas { display: block; image-rendering: pixelated; border: 2px solid #3a2c1c; background: #0f0c08; }
</style></head>
<body>
<h1>Vier offene Fragen zur Optik</h1>
<p class="lead">Alles mit den echten Zeichenfunktionen des Spiels; die Varianten liegen als Nachbearbeitung darueber. Links jeweils der heutige Stand.</p>
<div id="inhalt"></div>
<script type="module">
import {
  zeichneHauptstadt, zeichneBastion, zeichneMauern, zeichneFigur, zeichneStufe, steinFuer,
} from '/src/client/units.ts';

const S = 5;
const OX = -36, OY = -32, W = 72, H = 58;
const BLAU = '#3a7ac2';

const NACHBARN = [[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
const mitteVon = (q, r) => ({ x: 23 * q + Math.ceil(11.5 * r), y: 17 * r });
const ECKEN = NACHBARN.map(([q, r], i) => {
  const a = mitteVon(q, r), [q2, r2] = NACHBARN[(i + 1) % 6], b = mitteVon(q2, r2);
  return { x: Math.round((a.x + b.x) / 3), y: Math.round((a.y + b.y) / 3) };
});
const px = (p) => ({ x: (p.x - OX) * S, y: (p.y - OY) * S });
const MITTE = px({ x: 0, y: 0 });
const ECKE_PX = ECKEN.map(px);

const bildLade = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
const KACHEL = {
  clay: await bildLade('/src/assets/tiles/clay_0_tile.png'),
  grass: await bildLade('/src/assets/tiles/grass_1_tile.png'),
  forest: await bildLade('/src/assets/tiles/forest_0_tile.png'),
};

function leer(breite = W, hoehe = H) {
  const c = document.createElement('canvas');
  c.width = breite * S; c.height = hoehe * S;
  c.getContext('2d').imageSmoothingEnabled = false;
  return c;
}

/** Sieben Kacheln derselben Sorte als Untergrund. */
function boden(g, art, mitte = art) {
  const felder = [[0, 0], ...NACHBARN].sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  for (const [q, r] of felder) {
    const img = q === 0 && r === 0 ? KACHEL[mitte] : KACHEL[art];
    if (!img) continue;
    const m = mitteVon(q, r);
    g.drawImage(img, (m.x - 13 - OX) * S, (m.y - 19 - OY) * S, 26 * S, 32 * S);
  }
}

/** Einen dunklen Rand um alles Gezeichnete legen - der Umriss-Vorschlag. */
function umriss(c, farbe = [20, 14, 9]) {
  const g = c.getContext('2d');
  const d = g.getImageData(0, 0, c.width, c.height);
  const a = d.data;
  const voll = (x, y) => x >= 0 && y >= 0 && x < c.width && y < c.height && a[(y * c.width + x) * 4 + 3] > 40;
  const neu = new Uint8ClampedArray(a);
  for (let y = 0; y < c.height; y++) {
    for (let x = 0; x < c.width; x++) {
      const i = (y * c.width + x) * 4;
      if (a[i + 3] > 40) continue;
      // Einen ganzen Kunstpixel breit, damit der Rand im Raster sitzt.
      if (voll(x - S, y) || voll(x + S, y) || voll(x, y - S) || voll(x, y + S)) {
        neu[i] = farbe[0]; neu[i + 1] = farbe[1]; neu[i + 2] = farbe[2]; neu[i + 3] = 255;
      }
    }
  }
  g.putImageData(new ImageData(neu, c.width, c.height), 0, 0);
}

/** Farben im Bild tauschen - fuer das kalte Dach auf warmem Grund. */
function tausche(c, paare) {
  const g = c.getContext('2d');
  const d = g.getImageData(0, 0, c.width, c.height);
  const a = d.data;
  const hex = (s) => [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];
  const liste = paare.map(([von, nach]) => [hex(von), hex(nach)]);
  for (let i = 0; i < a.length; i += 4) {
    if (a[i + 3] < 40) continue;
    for (const [v, n] of liste) {
      if (Math.abs(a[i] - v[0]) < 6 && Math.abs(a[i + 1] - v[1]) < 6 && Math.abs(a[i + 2] - v[2]) < 6) {
        a[i] = n[0]; a[i + 1] = n[1]; a[i + 2] = n[2];
        break;
      }
    }
  }
  g.putImageData(d, 0, 0);
}

/** Die Hauptstadt Stufe II auf durchsichtigem Grund - zum Nachbearbeiten. */
function bauAllein(sorte) {
  const c = leer();
  const g = c.getContext('2d');
  const stein = steinFuer(sorte);
  const kanten = [0,1,2,3,4,5].map((i) => ({ a: ECKE_PX[i], b: ECKE_PX[(i + 1) % 6], stein }));
  zeichneMauern(g, kanten, S);
  for (const i of [0, 2, 4]) if (ECKE_PX[i].y <= MITTE.y) zeichneBastion(g, ECKE_PX[i].x, ECKE_PX[i].y, S, BLAU, sorte);
  zeichneHauptstadt(g, MITTE.x, MITTE.y, S, BLAU, sorte, 2);
  for (const i of [0, 2, 4]) if (ECKE_PX[i].y > MITTE.y) zeichneBastion(g, ECKE_PX[i].x, ECKE_PX[i].y, S, BLAU, sorte);
  return c;
}

function figur(canvas, titel, text) {
  const f = document.createElement('figure');
  f.innerHTML = `<figcaption><b>${titel}</b><br>${text}</figcaption>`;
  f.append(canvas);
  return f;
}
function abschnitt(titel, lead, stuecke) {
  const w = document.getElementById('inhalt');
  const h = document.createElement('h2'); h.textContent = titel;
  const p = document.createElement('p'); p.className = 'lead'; p.textContent = lead;
  const reihe = document.createElement('div'); reihe.className = 'reihe';
  for (const [t, text, c] of stuecke) reihe.append(figur(c, t, text));
  w.append(h, p, reihe);
}

// --- 1. Lehm-Kontrast ------------------------------------------------------

function lehm(art) {
  const c = leer();
  const g = c.getContext('2d');
  boden(g, 'clay');
  const bau = bauAllein('clay');
  if (art === 'umriss' || art === 'beides') umriss(bau);
  if (art === 'dach' || art === 'beides') {
    // Ziegelrot -> Schiefer: kalt auf warmem Grund.
    tausche(bau, [['#b8402e', '#4a5a6e'], ['#842a1e', '#2e3a48']]);
  }
  g.drawImage(bau, 0, 0);
  return c;
}

abschnitt('1. Lehm-Kontrast', 'Die Hauptstadt auf Lehm. Heute nimmt der Stein die Farbe des Gelaendes an - und verschwindet darin.', [
  ['Heute', 'Brauner Bau auf braunem Grund. Die Silhouette geht verloren.', lehm('jetzt')],
  ['Mit Umriss', 'Ein Kunstpixel dunkler Rand aussen herum. Wirkt auf jedem Gelaende.', lehm('umriss')],
  ['Kaltes Dach', 'Ziegelrot wird Schiefer - ein kalter Akzent auf warmem Grund.', lehm('dach')],
  ['Beides', 'Mein Vorschlag: erst der Umriss, dann die Dachfarbe.', lehm('beides')],
]);

// --- 2. Zahlenmarker -------------------------------------------------------

function marker(g, x, y, zahl, gross) {
  const r = (gross ? 9 : 6) * S;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2);
  g.fillStyle = '#f2ead4'; g.fill();
  g.lineWidth = 2 * S; g.strokeStyle = '#3a2a1e'; g.stroke();
  g.fillStyle = zahl === 6 || zahl === 8 ? '#9c3226' : '#1b130d';
  g.font = `${(gross ? 11 : 8) * S}px 'Silkscreen', monospace`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(String(zahl), x, y + S);
}

function zahlen(art) {
  const c = leer();
  const g = c.getContext('2d');
  boden(g, 'clay');
  g.drawImage(bauAllein('clay'), 0, 0);
  const zahlen = [9, 4, 5, 11, 3];
  NACHBARN.slice(0, 5).forEach(([q, r], i) => {
    const m = px(mitteVon(q, r));
    // Heute sitzt der Marker in der Feldmitte, gross - er ragt auf den Ring.
    // Vorschlag: kleiner und nach aussen versetzt.
    const weg = art === 'klein' ? 5 * S : 0;
    const dx = m.x - MITTE.x, dy = m.y - MITTE.y;
    const len = Math.hypot(dx, dy) || 1;
    marker(g, m.x + (dx / len) * weg, m.y + (dy / len) * weg, zahlen[i], art !== 'klein');
  });
  return c;
}

abschnitt('2. Zahlenmarker an der Hauptstadt', 'Fuenf Marker draengen sich um ein Feld; unten links schneidet einer die Bastion an.', [
  ['Heute', 'Grosse Marker in der Feldmitte - sie ragen auf den Ring.', zahlen('jetzt')],
  ['Kleiner und nach aussen', 'Um die Haelfte kleiner, ein Stueck vom Bau weggerueckt.', zahlen('klein')],
]);

// --- 3. Wald vor dem Ring --------------------------------------------------

/** Ein Baum als Pixelkarte - wie auf den Waldkacheln. */
const BAUM = [
  '..GG..','.GGGG.','GGGGGG','.GGGG.','..GG..','..tt..','..tt..',
];
const BAUM_PAL = { G: '#3f6f24', t: '#5e3d25' };
function baum(g, xArt, fyArt) {
  BAUM.forEach((z, zy) => [...z].forEach((ch, zx) => {
    if (ch === '.') return;
    g.fillStyle = BAUM_PAL[ch];
    g.fillRect((xArt - 3 + zx - OX) * S, (fyArt - (BAUM.length - 1) + zy - OY) * S, S, S);
  }));
}

function wald(art) {
  const c = leer();
  const g = c.getContext('2d');
  boden(g, 'forest', 'clay');
  if (art === 'davor') {
    g.drawImage(bauAllein('clay'), 0, 0);
    baum(g, -14, 20); baum(g, 14, 20);
  } else {
    baum(g, -14, 20); baum(g, 14, 20);
    g.drawImage(bauAllein('clay'), 0, 0);
  }
  return c;
}

abschnitt('3. Wald vor dem Ring', 'Ein Waldfeld vor der Hauptstadt. Heute steht der Baum vor der Mauer und schneidet sie an.', [
  ['Heute - Baum vor der Mauer', 'Der Baum des Nachbarfeldes legt sich ueber den Ring.', wald('davor')],
  ['Baum hinter die Mauer', 'Dieselbe Regel wie beim Turm: was naeher steht, kommt davor.', wald('dahinter')],
]);

// --- 4. Stufen am Aussehen -------------------------------------------------

const RITTER = [
  '..kkk...','.kmmmk..','.kmMMk..','.kmmmk..','kkkkkkk.','kppmppmk','kpppppmk','kppyppmk','.kpppk..','.kMkMk..','.kMkMk..','.kk.kk..',
];
/*
 * Keine Narbe: in 9 x 12 Kunstpixeln sind zwei rote Punkte im Gesicht nicht
 * zu erkennen - sie sehen aus wie ein Zeichenfehler. Der Rang zeigt sich am
 * Helm, an der Feder und zuletzt am Umhang.
 */
const STUFE_ZUSATZ = [
  null,
  { helm: '#c9ccd6' },
  { helm: '#c9ccd6', feder: '#9c3226' },
  { helm: '#e0e4ea', feder: '#f2c94c' },
  { helm: '#f2c94c', feder: '#f2c94c', umhang: '#6a4fa0' },
];

function ritterStufe(stufe) {
  const c = leer(30, 26);
  const g = c.getContext('2d');
  const OX2 = -15, OY2 = -20;
  const p = (x, y, farbe) => { g.fillStyle = farbe; g.fillRect((x - OX2) * S, (y - OY2) * S, S, S); };
  const zusatz = STUFE_ZUSATZ[stufe];
  // Umhang zuerst, er liegt hinter der Figur.
  if (zusatz?.umhang) for (let y = 4; y < 11; y++) { p(-5, y, zusatz.umhang); p(4, y, zusatz.umhang); }
  RITTER.forEach((z, zy) => [...z].forEach((ch, zx) => {
    if (ch === '.') return;
    const farbe = ch === 'p' ? BLAU : ch === 'P' ? '#2a5c96' : ch === 'k' ? '#1b130d'
      : ch === 'm' ? (zusatz?.helm ?? '#b9b3a6') : ch === 'M' ? '#857e70' : ch === 'y' ? '#f2c94c' : '#ff00ff';
    p(zx - 4, zy - 11, farbe);
  }));
  if (zusatz?.feder) { p(-1, -12, zusatz.feder); p(-1, -13, zusatz.feder); }
  // Die Winkel, die es heute schon gibt.
  for (let i = 0; i < stufe; i++) {
    const x = -2 + i * 4 - (stufe - 1) * 2;
    p(x, -15, '#f2c94c'); p(x + 1, -16, '#f2c94c'); p(x + 2, -15, '#f2c94c');
  }
  return c;
}

/**
 * Jetzt aus dem Spielcode selbst: dieselbe zeichneFigur, die das Brett
 * benutzt, mit der Stufe als letztem Parameter - plus die Winkel darueber.
 */
function ausDemSpiel(kind, stufe) {
  const c = leer(26, 24);
  const g = c.getContext('2d');
  const mx = (13 - OX) * S, my = (16 - OY) * S;
  // Ein Stueck Wiese als Grund, damit heller Stahl nicht auf Schwarz liegt.
  if (KACHEL.grass) g.drawImage(KACHEL.grass, mx - 13 * S, my - 22 * S, 26 * S, 32 * S);
  zeichneFigur(g, kind, mx, my, S, BLAU, undefined, stufe);
  zeichneStufe(g, kind, mx, my, S, stufe);
  return c;
}

abschnitt('4. Stufen am Aussehen - so, wie das Spiel es jetzt zeichnet',
  'Aus dem Spielcode, nicht nachgebaut: Helm, Feder und Umhang kommen aus stufenKarte, die Winkel aus zeichneStufe. Ohne Narbe.', [
  ['Stufe 0', 'Wie er antritt.', ausDemSpiel('ritter', 0)],
  ['Stufe 1', 'Blanker Helm statt grauem Stahl.', ausDemSpiel('ritter', 1)],
  ['Stufe 2', 'Rote Feder - ab hier traegt er auch einen Namen.', ausDemSpiel('ritter', 2)],
  ['Stufe 3', 'Die Feder wird golden.', ausDemSpiel('ritter', 3)],
  ['Stufe 4', 'Goldener Helm und Umhang in seiner Farbe.', ausDemSpiel('ritter', 4)],
  ['Bogen, Stufe 4', 'Dieselbe Regel gilt fuer Bogenschuetzen.', ausDemSpiel('bogen', 4)],
  ['Held, Stufe 3', 'Und fuer den Helden - ueber seiner eigenen Gestalt.', ausDemSpiel('held', 3)],
]);

document.body.dataset.fertig = '1';
</script>
</body></html>
